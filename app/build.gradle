apply plugin: 'com.android.application'

android {
    compileSdkVersion 33
    // 取消掉系统对.9图片的检查
//    aaptOptions.cruncherEnabled = false
//    aaptOptions.useNewCruncher = false
    defaultConfig {
        applicationId "com.htgd.radiocontrol.aeroradiocontrol"
        minSdkVersion 19
        targetSdkVersion 33
        versionCode 3
        versionName "3.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters = ["armeabi-v7a"]
        }
        //添加此行
        multiDexEnabled true
    }
    signingConfigs {
        //签名1
        /* dr_sign1 {
             keyAlias 'wzq'//别名
             keyPassword 'wzq@1993'//别名密码
             storeFile file('F:/jks/a9006_first_sign/a9006sign.jks')//签名文件路径
             storePassword 'wan@1993'//签名密码
         }*/
        debug{
            keyAlias 'wzq'//别名
            keyPassword 'wzq@1993'//别名密码
            storeFile file('./signkey/a9006sign.jks')//签名文件路径
            storePassword 'wan@1993'//签名密码
        }
    }

    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
    /*左滑临时语音版本*/
    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets{
        main{
            jniLibs.srcDir 'libs'
            //disable automatic ndk-build
        }
    }
    namespace 'com.htgd.radiocontrol.aeroradiocontrol'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(path: ':screanadaption')
    testImplementation 'junit:junit:4.12'
    implementation files('libs/eventbus-3.0.0.jar')

    implementation 'androidx.appcompat:appcompat:1.0.2'
    implementation files('libs/gson-2.7.jar')
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    //万能Adapter
    implementation 'com.zhy:base-rvadapter:3.0.3'
    implementation 'com.androidkun:XTabLayout:1.1.4'
    implementation 'com.github.jdsjlzx:LRecyclerView:1.5.4.3'
    //动画库
    implementation 'com.wang.avi:library:1.0.0'
    //二维码扫描
    implementation 'com.acker:simplezxing:1.5'
    implementation files('libs/okio-1.13.0.jar')
    implementation files('libs/okhttp-3.2.0.jar')
    //百度sdk
    implementation files('libs/BaiduLBS_Android.jar')
    implementation 'cat.ereza:customactivityoncrash:2.2.0'
    //添加此行
    implementation 'com.android.support:multidex:1.0.3'
    //百度sdk

    implementation 'io.reactivex.rxjava2:rxandroid:2.1.0'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.9'
    implementation files('libs/htapplib.aar')
    implementation 'com.github.jdsjlzx:LRecyclerView:1.5.4.3'
    implementation 'androidx.recyclerview:recyclerview:1.0.0'
    implementation  'com.contrarywind:Android-PickerView:4.1.9'

}
