apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'dagger.hilt.android.plugin'

android {
    compileSdkVersion 35
    // 取消掉系统对.9图片的检查
//    aaptOptions.cruncherEnabled = false
//    aaptOptions.useNewCruncher = false
    defaultConfig {
        applicationId "com.htgd.radiocontrol.aeroradiocontrol"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 3
        versionName "3.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        ndk {
            // armeabi-v7a is the htapplib.aar's only ABI (voice intercom native libs).
            // arm64-v8a is added so the APK can install on 64-bit-only devices
            // (Pixel 7+, modern emulators) for UI/non-voice testing during the
            // multi-version upgrade. Voice intercom will not work on arm64 until
            // the aar vendor ships 64-bit native libs (Layer 3).
            // Baidu Map SDK already ships .so for both ABIs in app/libs/.
            abiFilters = ["armeabi-v7a", "arm64-v8a"]
        }
        //添加此行
        multiDexEnabled true
    }
    signingConfigs {
        //签名1
        /* dr_sign1 {
             keyAlias 'wzq'//别名
             keyPassword 'wzq@1993'//别名密码
             storeFile file('F:/jks/a9006_first_sign/a9006sign.jks')//签名文件路径
             storePassword 'wan@1993'//签名密码
         }*/
        debug{
            keyAlias 'wzq'//别名
            keyPassword 'wzq@1993'//别名密码
            storeFile file('./signkey/a9006sign.jks')//签名文件路径
            storePassword 'wan@1993'//签名密码
        }
    }

    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
    /*左滑临时语音版本*/
    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets{
        main{
            jniLibs.srcDir 'libs'
            //disable automatic ndk-build
        }
    }

    // Phase 0 architecture foundation:
    //   Hilt 2.51+, AGP 8.7+, and Kotlin 1.9+ all require source/target Java 17.
    //   This change is binary-compatible with the existing Java 8 source — Java 17
    //   is a strict superset; legacy code keeps compiling unchanged.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    namespace 'com.htgd.radiocontrol.aeroradiocontrol'
}

// Required by Hilt: enable correct annotation-processor dependency injection
// for code generated by Dagger / Hilt.
kapt {
    correctErrorTypes = true
}

// Force a single Kotlin stdlib version across the dependency graph.
// AppCompat 1.7.x pulls kotlin-stdlib 1.8+, which absorbed the contents of
// the old kotlin-stdlib-jdk7 / kotlin-stdlib-jdk8 split artifacts. Some older
// transitive dependencies in this project still pin the legacy jdk8 artifact
// at 1.6.21, producing duplicate-class errors on classes like
// kotlin.collections.jdk8.CollectionsJDK8Kt. Excluding the legacy split is
// safe because all of its symbols now live in kotlin-stdlib.
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    // Auto-pick local jars from libs/, except those replaced by modern Maven
    // dependencies in Phase 0:
    //   - gson-2.7.jar          → 'com.google.code.gson:gson:2.10.1'
    //   - okio-1.13.0.jar       → transitive from okhttp 4.12.0 (okio 3.x)
    //   - okhttp-3.2.0.jar      → 'com.squareup.okhttp3:okhttp:4.12.0'
    // OkHttp 4 keeps the same okhttp3.* package name as OkHttp 3.x and was
    // designed as a drop-in replacement, so the legacy RequestManger code
    // continues to compile and run against it.
    implementation fileTree(
        include: ['*.jar'],
        exclude: ['gson-2.7.jar', 'okio-1.13.0.jar', 'okhttp-3.2.0.jar'],
        dir: 'libs'
    )
    implementation project(path: ':screanadaption')
    testImplementation 'junit:junit:4.13.2'
    implementation files('libs/eventbus-3.0.0.jar')

    implementation 'androidx.appcompat:appcompat:1.7.1'
    // Modern Gson (replaces the local 2.7 jar from 2016).
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    //万能Adapter
    implementation 'com.zhy:base-rvadapter:3.0.3'
    implementation 'com.androidkun:XTabLayout:1.1.4'
    implementation 'com.github.jdsjlzx:LRecyclerView:1.5.4.3'
    //动画库
    implementation 'com.wang.avi:library:1.0.0'
    //二维码扫描
    implementation 'com.acker:simplezxing:1.5'
    // okhttp + okio: provided via Phase 0 Maven deps further below (4.12.0 + 3.x).
    // The legacy libs/okhttp-3.2.0.jar and libs/okio-1.13.0.jar are excluded
    // from the fileTree at the top of this block; they stay on disk for now
    // but are not on the classpath.
    //百度sdk
    implementation files('libs/BaiduLBS_Android.aar')
    implementation 'cat.ereza:customactivityoncrash:2.4.0'
    //添加此行
    implementation 'androidx.multidex:multidex:2.0.1'
    //百度sdk

    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation files('libs/htapplib.aar')
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation  'com.contrarywind:Android-PickerView:4.1.9'

    // ─────────────────────────────────────────────────────────────────────────
    // Phase 0 architecture foundation (Kotlin + modern Jetpack stack).
    //
    // These libraries underpin the new development pattern for incoming features
    // (push, after-sales agent, photo schedule recognition). Existing Java
    // activities continue to use the legacy stack (RxJava 2, OkHttp 3.2 jar,
    // direct RequestManger calls); migration happens incrementally per screen.
    // ─────────────────────────────────────────────────────────────────────────

    // Kotlin standard library (auto-pulled by kotlin-android plugin, declared
    // explicitly so the version is visible in dependencies tree).
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    // Coroutines: replaces RxJava 2 for new async code.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Hilt: dependency injection. Replaces ad-hoc `new XxxUtil(this)` patterns.
    implementation "com.google.dagger:hilt-android:$hilt_version"
    kapt "com.google.dagger:hilt-android-compiler:$hilt_version"

    // Lifecycle / ViewModel: state lives in ViewModel, not Activity.
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'

    // Retrofit + modern OkHttp: replaces legacy okhttp-3.2.0.jar for new API
    // calls. Old RequestManger code keeps using the local jar; new Repositories
    // use Retrofit. Both can coexist.
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Room: structured local persistence for new features (chat history,
    // schedule cache, fault history). Replaces SharedPreferences for any
    // non-trivial storage in new code.
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // Test stack for new code (legacy junit:4.13.2 above stays for old tests).
    testImplementation 'io.mockk:mockk:1.13.13'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    testImplementation 'app.cash.turbine:turbine:1.2.0'
}
