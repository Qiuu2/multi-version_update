[package]
name = "local-calendar"
version = "0.1.0"
description = "本地日历 / 待办面板"
edition = "2021"
rust-version = "1.77"

[lib]
name = "local_calendar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
