# 构建 desktop-calendar 的桌面安装包。
# 手动触发（Actions → Build desktop calendar → Run workflow），或推 v* 标签。
# 产物在每次运行的 Artifacts 里下载。
name: Build desktop calendar

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos-apple-silicon
          - os: ubuntu-22.04
            name: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Tauri 在 Linux 上要系统 webview
      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-calendar/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-calendar/src-tauri -> target

      - name: 安装前端依赖
        working-directory: desktop-calendar
        run: npm ci

      # 前端先独立构建一次，前端挂了就不必等 Rust 编译
      - name: 构建前端
        working-directory: desktop-calendar
        run: npm run build

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop-calendar

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: 本地日历-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop-calendar/src-tauri/target/release/bundle/**/*.msi
            desktop-calendar/src-tauri/target/release/bundle/**/*-setup.exe
            desktop-calendar/src-tauri/target/release/bundle/**/*.dmg
            desktop-calendar/src-tauri/target/release/bundle/**/*.deb
            desktop-calendar/src-tauri/target/release/bundle/**/*.AppImage

  # 单文件 HTML：不需要 Rust，几秒钟就能出，双击即可用
  single-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-calendar/package-lock.json
      - name: 构建单文件
        working-directory: desktop-calendar
        run: |
          npm ci
          npm run build:single
          mv dist-single/index.html dist-single/本地日历.html
      - uses: actions/upload-artifact@v4
        with:
          name: 本地日历-单文件HTML
          if-no-files-found: error
          path: desktop-calendar/dist-single/本地日历.html
