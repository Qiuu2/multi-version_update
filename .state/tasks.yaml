# ── 团队标准 (本期立) ──
team_standards:
  - id: "STD-CRLF"; rule: "每次 Edit 后 git diff --stat; HEAD 为 LF 的文件若被翻成 CRLF 必须复原 (sed 's/\\r$//')。判据=与该文件 HEAD 的 EOL 一致"; reason: "Edit 工具本环境对 LF 文件可能引入 CRLF (AR-008/AR-006 各中一次), 制造假 diff + 共享文件 merge 冲突"; ref: "memory/edit-tool-crlf-gotcha.md"
  - id: "STD-SHAREDFILE"; rule: "改 build.gradle / AndroidManifest.xml 等共享配置文件时, 交付物显式声明改动的确切行范围; diff 不得跨到他人的行; 每个改动行归属唯一任务, 由该任务的域评审把关"; reason: "AR-003+AR-008 并发编辑 build.gradle, AR-003 的 security-crypto 依赖差点从 AR-008 评审偷渡过审绕开 data 域 (§4 R→). Critic 拦下"; shared_files_watch: ["app/build.gradle (AR-003 deps / AR-008 ndk注释)", "AndroidManifest.xml (AR-006 / 未来权限 AR-010)"]
  - id: "STD-COMPILABLE"; rule: "共享工作树无 per-task 分支隔离; 每轮收尾把树留在 :app 可编译状态 (WIP 用 TODO() 占位也要编译过); 必须瞬态破坏先知会 PM 协调时序"; reason: "AR-003 refresh 重设计瞬态致编译挂, 阻塞 AR-007 单测. 现已恢复(data 实测 BUILD SUCCESSFUL)"
  - id: "STD-ICD-WRITE"; rule: "references/icd-contracts.md (ICD 注册表) 由 PM 维护统写; 各域在 deliverable 提 proposed ICD diff, PM 过 Critic 后串行写入"; reason: "legacy-native 更 §7 时撞并发写冲突(file modified since read); 注册表是热共享文件, 需 PM 串行化 (PM profile 明列 ICD Registry 职责)"
  - id: "STD-CANONICAL-STATE"; rule: "权威任务状态 = .state/tasks.yaml(PM维护,gate-aware) + REVIEW_REQUEST/REVIEW_RESULT 消息链; harness TaskList 的 'completed' = teammate '已交付' 便利标记, ≠ 协议 COMPLETED(必须 Critic PASS + PM 确认). 判 gate 完整性以 .state + Critic REVIEW_RESULT 为准"; reason: "Critic 见 harness AR-002=completed 但未收 REVIEW_REQUEST, 疑 gate 被绕过. 实为 teammate 乐观自标超前于 gate. 制度: 无 Critic PASS, PM 不标 .state COMPLETED"
  - id: "STD-DAEMON-STALE"; rule: "跨任务编译报错: 两方对编译态分歧时, 唯一权威裁决 = 中立方(Critic)在清缓存后 --rerun-tasks 的**新鲜编译**, 不信任任一方的'我这绿了'自报(自报只对其声称时刻的树有效, 树被改后即过时). PM 不得据自报反驳实测报错方."; reason: "AR-007/AR-002 是 stale(自报准); 但 AR-101 PM 据 data '16测绿'自报误判 fe-platform/fe-business 的真 BLOCKER 为 stale——自报是改接口前的, data 改后未重编. 教训: 自报green 会过时, Critic 亲跑编译才是裁决. PM 已向 fe-platform/fe-business 致歉更正"
  - id: "STD-PERIODIC-TEST"; rule: "带周期 timer 的协程组件单测: 用 bounded advanceTimeBy()+runCurrent() (非 advanceUntilIdle, 会因无限周期 loop 永不返回→OOM) + 客户端 scope 用独立 Job(非 TestScope 子) + @After cancel"; reason: "fe-platform AR-103 RealtimeClient(心跳15s/轮询10s) 踩坑自修; 适用 AR-101/102 轮询 + WS + 任何周期组件"
  - id: "STD-ICD-CLASS"; rule: "ICD 建立二分(CTO D-12): (1)可逆推类[AAR/TCP4521/旧栈已实现REST字段]→从v3代码逆推+每字段标来源(逆推自 file:line)→可直接 LIVE(code-fact); (2)需验证类[WS协议/v4新增端点]→逆推/Handoff出 DRAFT→必须后端实测对接才转 LIVE, 对接前下游 ignoreUnknownKeys 容错"; reason: "CTO 方向性指示; 区分'代码跑通的事实'vs'待外部确认的假设', 防把猜测当定稿"
  - id: "STD-BUILD-SERIAL"; rule: "编译/测试验证一律 ./gradlew --no-daemon (隔离自己 build); 禁 ./gradlew --stop (杀全队共享 daemon in-flight build). **真错 vs 幽灵的判据=有无具体 compiler 诊断**: 有 'e: file:line ...' 诊断=真错必修; 仅 'daemon has been stopped: stop command received' 无诊断=被杀幽灵. **不得用 daemon 理论回溯解释掉有诊断的真错**(Critic 守此边界)"; reason: "data 实证 daemon 互杀是 AR-007/AR-002 幽灵 FAILED 根因; 但 AR-101 v1 是**真 BLOCKER**(有具体诊断 getTerminals overrides nothing), PM 曾误框为幽灵, Critic 纠正——--no-daemon 消歧义来源, 不抹真错"

