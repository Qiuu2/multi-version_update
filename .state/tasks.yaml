# ── D-16 CTO decision 2026-06-01 ──
d16_2026_06_01:
  trigger: "CTO 2026-06-01 实测发现 BLOCKER-3 鉴权 split-brain 不仅 uninstall 路径触发，**kill-app 路径**普通日常使用即触发 (登录→后台滑掉→重启→直接进内部页+NPE 'serveraddress must not be null')。"
  severity_upgrade: "P0_BLOCKER → P0_CRITICAL（日常触发）"
  cto_chosen_solution: "方案 C — 记住我 toggle 式两层存储 + 启动两步判断 + 退出独立 path + 原子不变量"
  two_layer_storage:
    L1_credentials_plaintext: ["account", "serverHost", "serverPort", "rememberMe(bool)"]
    L2_auth_encrypted: ["token", "refreshToken?", "tokenExpiry"]
  startup_two_step_decision: |
    onAppStart:
      val authState = readL2()  // atomic check 三件
      if (authState 全有 && tokenExpiry 未过) → MainScreen
      else → clearL2Atomically + 读 L1 → LoginScreen(prefill_based_on_rememberMe, password=空)
  atomic_invariant: "L2 三件 (token+serverAddress+账号) 要么全有要么全无；任一缺失=clearL2Atomically+回 LoginScreen"
  exit_semantics:
    user_logout: "清 L2，留 L1"
    token_expired: "同上"
    api_401: "同上"
    rememberMe_toggle_off: "清 L1 account/host/port + 标 rememberMe=false，不动 L2"
    login_success: "写 L2 + (rememberMe 开则) 写 L1"
  blocks: "BL-AUTH-SPLIT-BRAIN-FIX (NEXT-2)"
  pm_artifacts_updated:
    - ".state/auth-split-brain-framing.md v2 (D-16 + 三根因 + 10 候选 + 6-stage sequencing)"
    - ".state/next2-data-audit-dispatch-draft.md v2 (D-16 + 8-section audit template)"
  next_action: "等 CTO GO NEXT-2 → PM SendMessage data-integration-2 dispatch"

